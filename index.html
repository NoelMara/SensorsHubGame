<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer Classroom</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e6ecea;--fg:#1f2b28;--card:#ffffff;--line:#c3cfcb;--accent:#2f6b57;--accent-fg:#ffffff;--chalk:#f2d16b;color-scheme:light dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a18;--fg:#e4ede9;--card:#1c2825;--line:#33443f;--accent:#6fc2a3;--accent-fg:#10201a}}
:root[data-theme="dark"]{--bg:#121a18;--fg:#e4ede9;--card:#1c2825;--line:#33443f;--accent:#6fc2a3;--accent-fg:#10201a}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.4}
[hidden],.hide{display:none!important}
.app{max-width:1120px;margin:0 auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;gap:8px;align-items:center}.top h1{font-size:1.05rem;margin:0 8px 0 0}#nick{width:150px}#who{margin-left:auto;font-size:.85rem;opacity:.85}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);min-width:0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.game{display:grid;grid-template-columns:minmax(0,680px) minmax(290px,1fr);gap:12px;align-items:start}
.stage{display:flex;flex-direction:column;gap:8px}
canvas{display:block;width:100%;height:auto;aspect-ratio:640/448;border-radius:10px;border:2px solid var(--line);background:#222;touch-action:none}
.ctrl{display:flex;gap:8px;align-items:stretch;user-select:none;-webkit-user-select:none}.cr{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
#msg{flex:1;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--chalk);border-radius:8px;padding:6px 10px;font-size:.9rem;display:flex;align-items:center}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:5px}.dpad button{font-size:1.1rem;touch-action:none}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#talk{height:44px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;border:none;touch-action:none}
@media (hover:hover) and (pointer:fine){.dpad,#talk{display:none}}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;max-height:calc(100vh - 62px);max-height:calc(100dvh - 62px)}
.tabs{display:flex;gap:4px}.tabs button{flex:1;padding:8px 2px;font-weight:700}.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.panes{flex:1;min-height:0;overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card button{padding:6px 12px}#code{width:90px;text-transform:uppercase}
.sw{display:flex;gap:5px;flex-wrap:wrap}.sw button{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid transparent}.sw button[aria-pressed="true"]{border-color:var(--fg)}
#chat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--chalk);border-radius:8px;padding:10px 12px;font-size:.95rem;margin-bottom:8px}
#log{max-height:40vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}#log b{margin-right:6px}
.row{display:flex;gap:6px}.row input{flex:1}.row button{padding:6px 12px}#send{background:var(--accent);color:var(--accent-fg);border:none}
.opt{flex:1 1 45%;text-align:left;padding:8px!important}.opt.sel{outline:3px solid var(--accent)}.opt.ok{background:#3f9a54;color:#fff}.opt.no{background:#c0392b;color:#fff}
#qt{width:100%;font-weight:700}#qo,#qh{display:flex;flex-wrap:wrap;gap:6px;width:100%}#qs,#qe,#lb{width:100%;font-size:.9rem}
.hint{font-size:.8rem;opacity:.75}
@media (max-width:760px){
 body{overflow:hidden}.app{height:100vh;height:100dvh;padding:6px 8px;gap:6px}.top h1{display:none}#nick{flex:1}input,select{font-size:16px}
 .game{flex:1;min-height:0;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:6px}.side{max-height:none;height:100%}.card button,.row button{min-height:40px}.opt{min-height:44px}
}
@media (orientation:landscape) and (max-height:560px){
 .app{height:100vh;height:100dvh;padding:4px 8px;gap:4px}.top h1{display:none}.top{margin-bottom:0}
 .game{flex:1;min-height:0;grid-template-columns:auto minmax(200px,1fr);grid-template-rows:auto minmax(0,1fr);gap:6px 8px}
 .stage{display:contents}#c{grid-column:1;grid-row:1/span 2;width:auto;height:min(calc(100vh - 54px),39vw);height:min(calc(100dvh - 54px),39vw)}
 .ctrl{grid-column:2;grid-row:1}.side{grid-column:2;grid-row:2;max-height:none;height:100%}
 .dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,40px)}#talk{height:36px}#msg{font-size:.78rem;padding:4px 8px}
}
#menu{display:none;padding:7px 12px;font-weight:700;background:var(--accent);color:var(--accent-fg);border:none}
.dpad button,#talk{user-select:none;-webkit-user-select:none}
@media (max-width:760px) and (orientation:portrait){
 .ctrl{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"m m" "d t";gap:8px 14px;align-items:center}
 .cr{display:contents}#msg{grid-area:m;min-height:38px}
 .dpad{grid-area:d;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:8px}
 .dpad button{font-size:1.3rem;border-radius:14px}
 #talk{grid-area:t;justify-self:end;width:100px;height:100px;border-radius:50%;font-size:1.05rem}
}
@media (orientation:landscape) and (max-height:560px){
 #menu{display:inline-block}
 .game{display:flex;justify-content:center;align-items:flex-start}.stage{display:block}
 #c{height:calc(100dvh - 50px);width:auto;max-width:100%}
 .ctrl,.cr{display:contents}
 .dpad{position:fixed;z-index:5;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:8px}
 .dpad button{opacity:.85;border-radius:14px;font-size:1.2rem}
 #talk{position:fixed;z-index:5;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;opacity:.92}
 #msg{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:min(42vw,420px);box-shadow:0 2px 10px rgba(0,0,0,.3)}#msg:empty{display:none}
 .side{position:fixed;z-index:10;top:0;right:0;bottom:0;width:min(360px,52vw);height:auto;max-height:none;padding:10px 12px;padding-right:calc(12px + env(safe-area-inset-right,0px));background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.35);transform:translateX(105%);transition:transform .2s}
 .side.open{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1>Computer Classroom</h1><input id="nick" maxlength="14" placeholder="Your name" aria-label="Your name"><button id="menu" aria-expanded="false">☰ Class <span id="mbadge"></span></button><span id="who">Solo</span></header>
  <main class="game">
    <section class="stage">
      <canvas id="c" width="640" height="448" aria-label="Top-down view of a classroom with computers on the desks"></canvas>
      <div class="pad ctrl">
        <div class="dpad">
      <button class="up" data-d="up" aria-label="Up">▲</button>
      <button class="left" data-d="left" aria-label="Left">◀</button>
      <button class="down" data-d="down" aria-label="Down">▼</button>
      <button class="right" data-d="right" aria-label="Right">▶</button>
    </div>
    <div class="cr"><div id="msg" aria-live="polite"></div><button id="talk">Talk</button></div>
      </div>
    </section>
    <aside class="side">
      <div class="card hide" id="door" aria-live="polite"></div>
      <nav class="tabs" role="tablist"><button role="tab" data-tab="quiz">Quiz</button><button role="tab" data-tab="class">Class <span id="tbadge"></span></button><button role="tab" data-tab="chat">Chat</button><button role="tab" data-tab="you">You</button></nav>
      <div class="panes">
        <section data-pane="quiz" role="tabpanel"><div class="card" id="quiz"><div id="qt"></div><div id="qo"></div><div id="qs"></div><div id="qe"></div>
    <div id="qh" class="hide"><select id="mod" aria-label="Module"><option value="0">Modules 5-8</option><option value="5">Module 5</option><option value="6">Module 6</option><option value="7">Module 7</option><option value="8">Module 8</option><option value="9">My questions</option></select><input id="tm" type="number" min="5" max="120" value="20" style="width:64px" aria-label="Seconds per question"><button id="st">Start quiz</button><button id="nx">Next</button><button id="rv">Reveal</button><button id="en">End</button></div></div>
  <div class="card hide" id="ed"><button id="etog">✏️ Make your own questions (<span id="ecount">0</span>)</button>
    <div id="eb" class="hide" style="width:100%;display:flex;flex-direction:column;gap:6px"><input id="eq" maxlength="140" placeholder="Question"><input id="e0" maxlength="50" placeholder="Answer A"><input id="e1" maxlength="50" placeholder="Answer B"><input id="e2" maxlength="50" placeholder="Answer C"><input id="e3" maxlength="50" placeholder="Answer D">
    <select id="ea"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><input id="ee" maxlength="120" placeholder="Explanation (optional)"><button id="eadd">Add question</button><span id="em"></span><div id="el"></div></div></div>
  </section>
        <section data-pane="class" role="tabpanel"><div class="card" id="lobby"><button id="gbtn" class="hide">Sign in with Google</button><button id="gout" class="hide">Sign out</button><button id="gleave" class="hide">Leave class</button><button id="host">Host a class</button><input id="code" maxlength="5" placeholder="CODE" aria-label="Class code"><button id="join">Join</button><span id="rm" style="font-size:.9rem"></span></div>
  <div class="card" id="lb"></div></section>
        <section data-pane="chat" role="tabpanel"><div id="chat" hidden>
    <div id="log" aria-live="polite"></div>
    <div class="row"><input id="inp" maxlength="200" placeholder="Say something…" autocomplete="off" aria-label="Your message"><button id="send">Send</button><button id="close">Close</button></div>
  </div>
  <div class="row" id="sayrow" style="margin-top:8px"><input id="say" maxlength="60" placeholder="Say to everyone nearby…" aria-label="Say to other players"><button id="sayb">Say</button><button class="em" aria-label="Wave">👋</button><button class="em" aria-label="Laugh">😂</button><button class="em" aria-label="Question">❓</button></div>
  </section>
        <section data-pane="you" role="tabpanel"><div class="card"><span>Shirt</span><div class="sw" id="sw" role="group" aria-label="Shirt color"></div><button id="hair">Hair</button><button id="lang"></button></div>
          <p class="hint">Move: WASD or arrows. Talk, sit or use a computer: E. Host a class and share the code or the page link; the host is the instructor and runs the quiz. Ms. Reyes, Mia and Jon only show up when you are alone.</p></section>
      </div>
    </aside>
  </main>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const msg=$('msg'),chatEl=$('chat'),logEl=$('log'),inp=$('inp'),nick=$('nick'),who=$('who');
const SCENE={title:'Computer Classroom',floor:['#c9a56b','#c19d62'],wall:'#b9c9c2',trim:'#6f8780',rug:'#7c3d4a'};
document.querySelector('h1').textContent=document.title=SCENE.title;
const SKIN=['#f0c9a0','#e3b389','#c68f66','#8d5a3b','#f5d5b8','#d9a679'],LOOK={'Ms. Reyes':{hs:2,ac:'glasses',cl:'#8a5cc4'},'Mia':{hs:1},'Jon':{hs:3,cl:'#d98a2b'}},BUB=[];
let LANG='tl';try{LANG=localStorage.getItem('cc_lang')||'tl'}catch(e){}let fs=10;
const COLORS=['#e0584a','#3b82c4','#3f9a54','#d98a2b','#8a5cc4','#2aa6a0'],HAIR=['#3a2a20','#1f1f2e','#7a4a22','#c9a227','#5b2a2a','#2a2a2a'];
const walls=[[0,0,640,32],[0,416,640,32],[0,0,32,448],[608,0,32,448]];
const items=[];const add=o=>items.push(o);
const SCREENS=['#6fc2e8','#9be08a','#f2d16b','#e89ac0'];

add({n:'Whiteboard',x:160,y:4,w:320,h:24,k:'board',lines:['Today: Intro to Computers. Task: open the typing program and finish level 2.','Someone drew a tiny cat in the corner of the board.']});
add({n:'Window',x:48,y:4,w:80,h:24,k:'win',lines:['A sunny day outside. Birds are on the fence.']});
add({n:'Window',x:512,y:4,w:80,h:24,k:'win',lines:['The playground is empty. Everyone is in class.']});
add({n:'Door',x:48,y:416,w:40,h:32,k:'door',lines:['The door is closed. Class is in session.']});
add({n:'Bookshelf',x:32,y:120,w:22,h:100,k:'shelf',solid:1,lines:['Dictionaries, a worn atlas, and a book called “Computers for Beginners.”']});
add({n:'Plant',x:566,y:372,w:24,h:28,k:'plant',solid:1,lines:['A plant that survived three semesters.']});
add({n:'Teacher’s computer',x:272,y:76,w:96,h:30,k:'desk',c:'#6d4420',solid:1,sc:0,lines:['The attendance sheet is open. Everyone is marked present.','A slideshow titled “Typing Speed Challenge” is ready to go.']});
add({n:'Ms. Reyes (Teacher)',x:310,y:118,w:20,h:20,k:'npc',ci:0,solid:1,ai:{persona:'You are Ms. Reyes, a warm, slightly witty college instructor in a BSIT computer lab. Students call you Ma’am. You help with programming, Python OOP, schedules and school requirements.',greet:{en:'Good morning! Pick any computer you like. Ask me anything.',tl:'Good morning! Pili lang kayo ng computer. Tanong lang kayo kung may kailangan.'}},lines:['Take any seat you like.']});
add({n:'Mia (Classmate)',x:560,y:210,w:20,h:20,k:'npc',ci:1,solid:1,ai:{persona:'You are Mia, a friendly, curious 2nd-year BSIT student who loves coding and gossips a little about deadlines, org events and the canteen.',greet:{en:'Hi! Did you finish the Python activity yet?',tl:'Uy! Tapos mo na ba yung Python activity?'}},lines:['Hi!']});
add({n:'Jon (Classmate)',x:62,y:330,w:20,h:20,k:'npc',ci:3,solid:1,ai:{persona:'You are Jon, a funny but kind college student who jokes a lot, loves mobile games, is always puyat from gaming, and procrastinates on requirements.',greet:{en:'Shh, I’m pretending to work. What’s up?',tl:'Shh, nagpapanggap akong nagko-code. Ano meron?'}},lines:['Hey.']});

const deskTxt=['Typing practice: 42 words per minute. Not bad!','A spreadsheet of lunch orders. Pizza is winning.','A paint program with a half-drawn rocket ship.','A quiz website. Question 3 is unanswered.','The browser is on a page about volcanoes.','A coding game: level 5, “Make the robot walk.”','Someone left a chat window open. It says “brb.”','A slideshow about dinosaurs. Slide 1 is perfect.','The screen is asleep. Wiggle the mouse?','A music player paused on a calm song.','A folder named “Homework FINAL final v2.”','A calculator app with a half-finished homework answer.'];
let di=0;
for(const y of [170,246,322])for(const x of [108,224,340,456]){add({n:'Computer '+(di+1),x,y,w:76,h:30,k:'desk',c:'#9a6a35',solid:1,sc:di%4,chair:1,lines:[deskTxt[di%deskTxt.length]]});di++}

const P={x:70,y:370,w:18,h:18,f:'u',m:false,ci:0,hs:0,sit:false};let myB='',myBn=0,myBUntil=0;
const keys={up:0,down:0,left:0,right:0};
const map={w:'up',arrowup:'up',s:'down',arrowdown:'down',a:'left',arrowleft:'left',d:'right',arrowright:'right'};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if(map[k]){keys[map[k]]=1;e.preventDefault()}else if(k==='e'||k==='enter')interact()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(map[k])keys[map[k]]=0});
document.querySelectorAll('[data-d]').forEach(b=>{const d=b.dataset.d,on=e=>{keys[d]=1;e.preventDefault()},off=()=>{keys[d]=0};
 b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off))});
$('talk').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
const sideEl=document.querySelector('.side'),menuB=$('menu');let needPrev=false;
const drawer=o=>{sideEl.classList.toggle('open',o);menuB.setAttribute('aria-expanded',o)};
menuB.onclick=()=>drawer(!sideEl.classList.contains('open'));cv.addEventListener('pointerdown',()=>drawer(false));

/* name + color */
try{nick.value=localStorage.getItem('cc_name')||'';P.ci=+localStorage.getItem('cc_ci')||0;P.hs=+localStorage.getItem('cc_hs')||0}catch(e){}
if(!nick.value)nick.value='Student';
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Shirt color '+(i+1));b.onclick=()=>{P.ci=i;saveMe();sendPresence(true)};$('sw').appendChild(b)});
function saveMe(){try{localStorage.setItem('cc_name',nick.value);localStorage.setItem('cc_ci',P.ci);localStorage.setItem('cc_hs',P.hs)}catch(e){}
 [...$('sw').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===P.ci))}
nick.addEventListener('input',()=>{saveMe();sendPresence(true)});saveMe();
const myName=()=>(nick.value.replace(/[^\p{L}\p{N} _.-]/gu,'').trim().slice(0,14))||'Student';

/* multiplayer */
let room=null,R=null,lastSent=0,lastKey='';const peerPos={},peerB={};
function sendPresence(force){
  if(!room)return;const now=performance.now();
  const key=[G.adm.join(),G.kk.join(),G.qn,G.ph,G.score,G.an,G.host,Math.round(P.x),Math.round(P.y),P.f,P.m,P.ci,P.hs,P.sit,myBn,myName()].join('|');
  if(!force&&(key===lastKey||now-lastSent<70))return;
  lastKey=key;lastSent=now;
  room.presence({x:Math.round(P.x),y:Math.round(P.y),f:P.f,m:P.m,c:P.ci,h:G.host?1:0,adm:G.adm,kk:G.kk,cq:G.cq,tm:G.tm,rs:G.rs,qn:G.qn,qi:G.qi,ph:G.ph,sc:G.score,an:G.an,hs:P.hs,s:P.sit?1:0,b:myB,bn:myBn,n:myName()}).catch(()=>{});
}
/* Firebase multiplayer + Google sign-in. Same room API the page already uses: join, peers, presence, leave */
const NET={err:'',on:null};
const FIREBASE_CONFIG={apiKey:"AIzaSyBnVyMmBbFjPbLpjQEvKJnfJwT5gtWxzjE",authDomain:"sensorshubgame.firebaseapp.com",databaseURL:"https://sensorshubgame-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"sensorshubgame",appId:"1:1884750891:web:a3664ee9deca1baafcd66e"};
function makeApi(uid,db){return{async join(name){
  const key=uid+'_'+Math.random().toString(36).slice(2,8),ref=db.ref('rooms/'+name+'/p'),me=ref.child(key),conn=db.ref('.info/connected');
  let peers={},last={},lastD=null,pend=null,timer=null;
  const flush=()=>{timer=null;if(!pend)return;const d=pend,upd={};pend=null;
    for(const k of Object.keys(d)){const v=JSON.stringify(d[k]);if(last[k]!==v){last[k]=v;upd[k]=d[k]}}
    for(const k of Object.keys(last))if(!(k in d)){delete last[k];upd[k]=null}
    if(Object.keys(upd).length)me.update(upd).catch(e=>{NET.err='The database refused to save you into the class ('+((e&&e.code)||'error')+'). The Firebase database rules need fixing.'})};
  ref.on('value',sn=>{peers=sn.val()||{};NET.err=''},e=>{NET.err='The database refused to let this device read the class ('+((e&&e.code)||'error')+'). The Firebase database rules need fixing.'});
  const vis=()=>{if(!document.hidden&&lastD){last={};pend={...lastD};flush()}};document.addEventListener('visibilitychange',vis);
  conn.on('value',sn=>{NET.on=!!sn.val();if(sn.val()){me.onDisconnect().remove();last={};if(lastD){pend={...lastD};flush()}}});
  return{
    peers:()=>Object.keys(peers).map(id=>({peer:id,isMe:id===key,sameTab:id===key,kind:'viewer',presence:peers[id]||{}})),
    presence(d){lastD=d;pend={...d};if(!timer)timer=setTimeout(flush,120);return Promise.resolve()},
    leave(){document.removeEventListener('visibilitychange',vis);ref.off();conn.off();clearTimeout(timer);me.remove().catch(()=>{})}}}}}
function resetMulti(){
  if(room){room.leave();room=null}
  Object.assign(G,{host:false,code:'',adm:[],kk:[],qn:0,qi:-1,ph:'idle',cq:null,score:0,an:-1,ci:-1});lastQn=-1;DOOR.wait=false;nick.readOnly=false;location.hash='';
  try{sessionStorage.removeItem('cc_host')}catch(e){}
  ['host','code','join'].forEach(i=>$(i).classList.remove('hide'));$('gleave').classList.add('hide')}
function setupAuth(){

function wrap(t){const L=[''];for(const w of t.split(' ')){const c=(L[L.length-1]+' '+w).trim();if(c.length>22&&L[L.length-1])L.push(w);else L[L.length-1]=c}return L.slice(0,4)}

  for(const b of BUB){const L=wrap(b.t),w=Math.max(...L.map(q=>ctx.measureText(q).width))+12,h=L.length*(fs+2)+8,bx=Math.max(4,Math.min(636-w,b.x-w/2)),by=Math.max(4,b.y-h);

function frame(t){
