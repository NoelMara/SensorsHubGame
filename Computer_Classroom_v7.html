<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer Classroom</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e6ecea;--fg:#1f2b28;--card:#ffffff;--line:#c3cfcb;--accent:#2f6b57;--accent-fg:#ffffff;--chalk:#f2d16b;color-scheme:light dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a18;--fg:#e4ede9;--card:#1c2825;--line:#33443f;--accent:#6fc2a3;--accent-fg:#10201a}}
:root[data-theme="dark"]{--bg:#121a18;--fg:#e4ede9;--card:#1c2825;--line:#33443f;--accent:#6fc2a3;--accent-fg:#10201a}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:14px;display:flex;flex-direction:column}
h1{order:0}.top{order:1}#lobby,#door{order:2}#c{order:3;aspect-ratio:640/448}.pad{order:4}#quiz,#ed{order:5}#msg{order:6}#chat{order:7}#sayrow{order:8}#lb{order:9}.hint{order:10}
button{touch-action:manipulation;-webkit-touch-callout:none}
h1{font-size:1.25rem;margin:0 0 8px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);min-width:0}
#nick{width:140px}
.sw{display:flex;gap:5px}
.sw button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}
.sw button[aria-pressed="true"]{border-color:var(--fg)}
#who{margin-left:auto;font-size:.85rem;opacity:.85}
canvas{display:block;width:100%;height:auto;border-radius:10px;border:2px solid var(--line);background:#222;image-rendering:pixelated;touch-action:none}
#msg,#chat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--chalk);border-radius:8px;padding:10px 12px;font-size:.95rem;margin-top:8px}
#msg{min-height:3.2em}
#log{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
#log b{margin-right:6px}
.row{display:flex;gap:6px}.row input{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row button{padding:6px 12px}#send{background:var(--accent);color:var(--accent-fg);border:none}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:12px;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px}
.dpad button{font-size:1.2rem;touch-action:none}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#talk{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:700;border:none;touch-action:none}
.hint{font-size:.8rem;opacity:.75;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card button{padding:6px 12px}.hide{display:none!important}#code{width:90px;text-transform:uppercase}
.opt{flex:1 1 45%;text-align:left;padding:8px!important}.opt.sel{outline:3px solid var(--accent)}.opt.ok{background:#3f9a54;color:#fff}.opt.no{background:#c0392b;color:#fff}
#qt{width:100%;font-weight:700}#qo,#qh{display:flex;flex-wrap:wrap;gap:6px;width:100%}#qs,#qe,#lb{width:100%;font-size:.9rem}
@media (max-width:600px){
 h1,.hint{display:none}.wrap{padding:8px}input,select{font-size:16px}.card button,.row button{min-height:40px}
 .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px)}#talk{width:84px;height:84px}.pad{margin-top:8px}#log{max-height:110px}.opt{min-height:44px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Computer Classroom</h1>
  <div class="top">
    <input id="nick" maxlength="14" placeholder="Your name" aria-label="Your name">
    <div class="sw" id="sw" role="group" aria-label="Shirt color"></div>
    <button id="hair" style="padding:5px 10px">Hair</button><button id="lang" style="padding:5px 10px"></button><button id="aib" style="padding:5px 10px">AI banter: off</button><span id="who">Solo</span>
  </div>
  <div class="card" id="lobby"><button id="host">Host a class</button><input id="code" maxlength="5" placeholder="CODE" aria-label="Class code"><button id="join">Join</button><span id="rm" style="font-size:.9rem"></span></div>
  <div class="card hide" id="door" aria-live="polite"></div>
  <canvas id="c" width="640" height="448" aria-label="Top-down view of a classroom with computers on the desks"></canvas>
  <div id="chat" hidden>
    <div id="log" aria-live="polite"></div>
    <div class="row"><input id="inp" maxlength="200" placeholder="Say something…" autocomplete="off" aria-label="Your message"><button id="send">Send</button><button id="close">Close</button></div>
  </div>
  <div class="card" id="quiz"><div id="qt"></div><div id="qo"></div><div id="qs"></div><div id="qe"></div>
    <div id="qh" class="hide"><select id="mod" aria-label="Module"><option value="0">Modules 5-8</option><option value="5">Module 5</option><option value="6">Module 6</option><option value="7">Module 7</option><option value="8">Module 8</option><option value="9">My questions</option></select><input id="tm" type="number" min="5" max="120" value="20" style="width:64px" aria-label="Seconds per question"><button id="st">Start quiz</button><button id="nx">Next</button><button id="rv">Reveal</button><button id="en">End</button></div></div>
  <div class="card hide" id="ed"><button id="etog">✏️ Make your own questions (<span id="ecount">0</span>)</button>
    <div id="eb" class="hide" style="width:100%;display:flex;flex-direction:column;gap:6px"><input id="eq" maxlength="140" placeholder="Question"><input id="e0" maxlength="50" placeholder="Answer A"><input id="e1" maxlength="50" placeholder="Answer B"><input id="e2" maxlength="50" placeholder="Answer C"><input id="e3" maxlength="50" placeholder="Answer D">
    <select id="ea"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><input id="ee" maxlength="120" placeholder="Explanation (optional)"><button id="eadd">Add question</button><span id="em"></span><div id="el"></div></div></div>
  <div class="card" id="lb"></div>
  <div id="msg" aria-live="polite"></div>
  <div class="row" id="sayrow" style="margin-top:8px"><input id="say" maxlength="60" placeholder="Say to everyone nearby…" aria-label="Say to other players"><button id="sayb">Say</button><button class="em" aria-label="Wave">👋</button><button class="em" aria-label="Laugh">😂</button><button class="em" aria-label="Question">❓</button></div>
  <div class="pad">
    <div class="dpad">
      <button class="up" data-d="up" aria-label="Up">▲</button>
      <button class="left" data-d="left" aria-label="Left">◀</button>
      <button class="down" data-d="down" aria-label="Down">▼</button>
      <button class="right" data-d="right" aria-label="Right">▶</button>
    </div>
    <button id="talk">Talk</button>
  </div>
  <p class="hint">Move: WASD or arrows. Talk or look: E. Host a class and share the code or the page link. The host is the teacher and runs the quiz. Ms. Reyes, Mia and Jon only show up when you are alone.</p>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const msg=$('msg'),chatEl=$('chat'),logEl=$('log'),inp=$('inp'),nick=$('nick'),who=$('who');
const SCENE={title:'Computer Classroom',floor:['#c9a56b','#c19d62'],wall:'#b9c9c2',trim:'#6f8780',rug:'#7c3d4a'};
document.querySelector('h1').textContent=document.title=SCENE.title;
const SKIN=['#f0c9a0','#e3b389','#c68f66','#8d5a3b','#f5d5b8','#d9a679'],LOOK={'Ms. Reyes':{hs:2,ac:'glasses',cl:'#8a5cc4'},'Mia':{hs:1},'Jon':{hs:3,cl:'#d98a2b'}},BUB=[];
let LANG='tl';try{LANG=localStorage.getItem('cc_lang')||'tl'}catch(e){}let fs=10;
const COLORS=['#e0584a','#3b82c4','#3f9a54','#d98a2b','#8a5cc4','#2aa6a0'],HAIR=['#3a2a20','#1f1f2e','#7a4a22','#c9a227','#5b2a2a','#2a2a2a'];
const walls=[[0,0,640,32],[0,416,640,32],[0,0,32,448],[608,0,32,448]];
const items=[];const add=o=>items.push(o);
const SCREENS=['#6fc2e8','#9be08a','#f2d16b','#e89ac0'];

add({n:'Whiteboard',x:160,y:4,w:320,h:24,k:'board',lines:['Today: Intro to Computers. Task: open the typing program and finish level 2.','Someone drew a tiny cat in the corner of the board.']});
add({n:'Window',x:48,y:4,w:80,h:24,k:'win',lines:['A sunny day outside. Birds are on the fence.']});
add({n:'Window',x:512,y:4,w:80,h:24,k:'win',lines:['The playground is empty. Everyone is in class.']});
add({n:'Door',x:48,y:416,w:40,h:32,k:'door',lines:['The door is closed. Class is in session.']});
add({n:'Bookshelf',x:32,y:120,w:22,h:100,k:'shelf',solid:1,lines:['Dictionaries, a worn atlas, and a book called “Computers for Beginners.”']});
add({n:'Plant',x:566,y:372,w:24,h:28,k:'plant',solid:1,lines:['A plant that survived three semesters.']});
add({n:'Teacher’s computer',x:272,y:76,w:96,h:30,k:'desk',c:'#6d4420',solid:1,sc:0,lines:['The attendance sheet is open. Everyone is marked present.','A slideshow titled “Typing Speed Challenge” is ready to go.']});
add({n:'Ms. Reyes (Teacher)',x:310,y:118,w:20,h:20,k:'npc',ci:0,solid:1,ai:{persona:'You are Ms. Reyes, a warm, slightly witty college instructor in a BSIT computer lab. Students call you Ma’am. You help with programming, Python OOP, schedules and school requirements.',greet:{en:'Good morning! Pick any computer you like. Ask me anything.',tl:'Good morning! Pili lang kayo ng computer. Tanong lang kayo kung may kailangan.'}},lines:['Take any seat you like.']});
add({n:'Mia (Classmate)',x:560,y:210,w:20,h:20,k:'npc',ci:1,solid:1,ai:{persona:'You are Mia, a friendly, curious 2nd-year BSIT student who loves coding and gossips a little about deadlines, org events and the canteen.',greet:{en:'Hi! Did you finish the Python activity yet?',tl:'Uy! Tapos mo na ba yung Python activity?'}},lines:['Hi!']});
add({n:'Jon (Classmate)',x:62,y:330,w:20,h:20,k:'npc',ci:3,solid:1,ai:{persona:'You are Jon, a funny but kind college student who jokes a lot, loves mobile games, is always puyat from gaming, and procrastinates on requirements.',greet:{en:'Shh, I’m pretending to work. What’s up?',tl:'Shh, nagpapanggap akong nagko-code. Ano meron?'}},lines:['Hey.']});

const deskTxt=['Typing practice: 42 words per minute. Not bad!','A spreadsheet of lunch orders. Pizza is winning.','A paint program with a half-drawn rocket ship.','A quiz website. Question 3 is unanswered.','The browser is on a page about volcanoes.','A coding game: level 5, “Make the robot walk.”','Someone left a chat window open. It says “brb.”','A slideshow about dinosaurs. Slide 1 is perfect.','The screen is asleep. Wiggle the mouse?','A music player paused on a calm song.','A folder named “Homework FINAL final v2.”','A calculator app showing 8008135. Very mature.'];
let di=0;
for(const y of [170,246,322])for(const x of [108,224,340,456]){add({n:'Computer '+(di+1),x,y,w:76,h:30,k:'desk',c:'#9a6a35',solid:1,sc:di%4,chair:1,lines:[deskTxt[di%deskTxt.length]]});di++}

const P={x:70,y:370,w:18,h:18,f:'u',m:false,ci:0,hs:0,sit:false};let myB='',myBn=0,myBUntil=0;
const keys={up:0,down:0,left:0,right:0};
const map={w:'up',arrowup:'up',s:'down',arrowdown:'down',a:'left',arrowleft:'left',d:'right',arrowright:'right'};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if(map[k]){keys[map[k]]=1;e.preventDefault()}else if(k==='e'||k==='enter')interact()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(map[k])keys[map[k]]=0});
document.querySelectorAll('[data-d]').forEach(b=>{const d=b.dataset.d,on=e=>{keys[d]=1;e.preventDefault()},off=()=>{keys[d]=0};
 b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off))});
$('talk').addEventListener('pointerdown',e=>{e.preventDefault();interact()});

/* name + color */
try{nick.value=localStorage.getItem('cc_name')||'';P.ci=+localStorage.getItem('cc_ci')||0;P.hs=+localStorage.getItem('cc_hs')||0}catch(e){}
if(!nick.value)nick.value='Student';
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Shirt color '+(i+1));b.onclick=()=>{P.ci=i;saveMe();sendPresence(true)};$('sw').appendChild(b)});
function saveMe(){try{localStorage.setItem('cc_name',nick.value);localStorage.setItem('cc_ci',P.ci);localStorage.setItem('cc_hs',P.hs)}catch(e){}
 [...$('sw').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===P.ci))}
nick.addEventListener('input',()=>{saveMe();sendPresence(true)});saveMe();
const myName=()=>(nick.value.replace(/[^\p{L}\p{N} _.-]/gu,'').trim().slice(0,14))||'Student';

/* multiplayer */
let room=null,R=null,lastSent=0,lastKey='';const peerPos={},peerB={};
function sendPresence(force){
  if(!room)return;const now=performance.now();
  const key=[G.adm.join(),G.kk.join(),G.qn,G.ph,G.score,G.an,G.host,Math.round(P.x),Math.round(P.y),P.f,P.m,P.ci,P.hs,P.sit,myBn,myName()].join('|');
  if(!force&&(key===lastKey||now-lastSent<70))return;
  lastKey=key;lastSent=now;
  room.presence({x:Math.round(P.x),y:Math.round(P.y),f:P.f,m:P.m,c:P.ci,h:G.host?1:0,adm:G.adm,kk:G.kk,cq:G.cq,tm:G.tm,rs:G.rs,qn:G.qn,qi:G.qi,ph:G.ph,sc:G.score,an:G.an,hs:P.hs,s:P.sit?1:0,b:myB,bn:myBn,n:myName()}).catch(()=>{});
}
(async()=>{try{R=window.claude?await claude.use('room'):null}catch(e){R=null}
 if(!R)$('rm').textContent='Solo practice (multiplayer needs a signed-in claude.ai viewer).';else{const h=location.hash.slice(1);if(/^[a-z0-9]{5}$/.test(h))enter(h,false)}})();
function others(){
  if(!room)return[];const out=[];
  for(const p of room.peers()){
    if(p.isMe||p.kind!=='viewer')continue;const d=p.presence;
    if(typeof d.x!=='number'||typeof d.y!=='number')continue;
    const tx=Math.max(32,Math.min(590,d.x)),ty=Math.max(32,Math.min(398,d.y));
    const q=peerPos[p.peer]||(peerPos[p.peer]={x:tx,y:ty});
    q.x+=(tx-q.x)*.3;q.y+=(ty-q.y)*.3;
    const r=peerB[p.peer]||(peerB[p.peer]={bn:-1,until:0}),bn=+d.bn|0;if(bn!==r.bn){r.bn=bn;r.until=bn&&d.b?performance.now()+5000:0}
    out.push({adm:Array.isArray(d.adm)?d.adm.filter(x=>typeof x==='string').slice(0,150):[],kk:Array.isArray(d.kk)?d.kk.filter(x=>typeof x==='string').slice(0,150):[],id:p.peer,cq:(c=>c&&typeof c.t==='string'&&Array.isArray(c.o)&&c.o.length===4&&Number.isInteger(c.a)&&c.a>=0&&c.a<4?{t:c.t.slice(0,140),o:c.o.map(x=>String(x).slice(0,50)),a:c.a,e:String(c.e||'').slice(0,120)}:null)(d.cq),tm:Math.max(5,Math.min(120,+d.tm||20)),rs:+d.rs|0,sit:d.s===1,h:d.h===1,qn:+d.qn|0,qi:Number.isInteger(d.qi)&&d.qi>=0&&d.qi<BANK.length?d.qi:-1,ph:d.ph==='show'||d.ph==='end'?d.ph:'ask',sc:Math.max(0,Math.min(99999,+d.sc|0)),an:+d.an|0,hs:Math.abs(+d.hs|0)%4,b:performance.now()<r.until?String(d.b||'').replace(/[\u0000-\u001f]/g,'').slice(0,60):'',x:q.x,y:q.y,f:'udlr'.includes(d.f)&&d.f.length===1?d.f:'d',m:d.m===true,ci:Math.abs(+d.c|0)%6,name:String(d.n||'Student').replace(/[\u0000-\u001f]/g,'').slice(0,14)});
  }
  return gate(out);
}

/* collisions + proximity */
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const hit=r=>walls.some(w=>overlap(r,{x:w[0],y:w[1],w:w[2],h:w[3]}))||items.some(it=>it.solid&&!it.off&&overlap(r,it));
function nearest(){let best=null,bd=16;for(const it of items){if(it.off)continue;
  const dx=Math.max(it.x-(P.x+P.w),P.x-(it.x+it.w),0),dy=Math.max(it.y-(P.y+P.h),P.y-(it.y+it.h),0),d=Math.hypot(dx,dy);
  if(d<bd){bd=d;best=it}}return best}

/* talking: canned lines for objects, AI chat for characters */
let talk=null,idx={},chat=null,sampleFn=null,aiOk=false,AIB=false,aiCalls=0,lastAI=0,banterAt=performance.now()+4000,banterBusy=false;
const npcs=items.filter(i=>i.k==='npc'),nm=n=>n.n.split(' (')[0],heard=[];
const CANNED={tl:[
[['Mia','Uy, natapos mo na ba yung Python activity?'],['Jon','Hindi pa. Bahala na si Lord.'],['Ms. Reyes','Jon, deadline na mamaya ha.']],
[['Jon','Mia, tingnan mo calculator ko, 8008135.'],['Mia','Jon, grow up nga.'],['Jon','Ayoko.']],
[['Ms. Reyes','Sino nag-iwan ng chat window na bukas?'],['Mia','Hindi ako yan, Ma’am!'],['Jon','Baka ako nga po.']],
[['Mia','Ang bagal ng Wi-Fi natin, kainis.'],['Ms. Reyes','I-restart mo muna yung browser, Mia.']],
[['Jon','Ma’am, pwede maglaro ng coding game after?'],['Ms. Reyes','Tapusin muna yung midterm review, Jon.']],
[['Mia','Anong review natin? Modules 5 to 8?'],['Jon','Oo, recursion pa lang takot na ako.'],['Mia','Base case lang naman yan, gets mo?']]],
en:[
[['Mia','Did you finish the Python activity yet?'],['Jon','Not yet. Bahala na.'],['Ms. Reyes','The deadline is tonight, Jon.']],
[['Jon','Mia, look, my calculator says 8008135.'],['Mia','Jon. Please grow up.'],['Jon','Never.']],
[['Ms. Reyes','Who left the chat window open again?'],['Mia','Not me, Ma’am!'],['Jon','Maybe me.']],
[['Mia','This Wi-Fi is slower than my cat.'],['Ms. Reyes','Restart your browser first, Mia.']],
[['Mia','Recursion scares me.'],['Jon','Same. Just remember the base case.']]]};
const EX={en:['Sorry, I was busy!','Sorry, I stepped out for a bit.','My bad, I was stuck in another class.'],tl:['Sorry, busy ako kanina!','Uy sorry, may pinasa pa kasi ako.','Pasensya na, na-late ako, traffic sa daan.']};
const BUSY={en:'Sorry, I was busy for a sec. Say that again?',tl:'Sorry, busy ako saglit. Ulitin mo nga?'};
const langRule=()=>LANG==='tl'?'Write in natural Taglish (Tagalog and English mixed) like Filipino college students really talk: casual, short, not deep Tagalog.':'Write in casual English.';
function speak(n,t,ms=4200){n.b={t,until:performance.now()+ms}}
function play(L){L.forEach(([w,t],i)=>setTimeout(()=>{const n=npcs.find(q=>nm(q)===w);if(n){speak(n,t);heard.push(w+': '+t);if(heard.length>8)heard.shift()}},i*2800))}
async function banter(){
  const now=performance.now();if(npcs[0].off||banterBusy||now<banterAt||document.hidden||chat)return;
  banterAt=now+11000+Math.random()*6000;
  if(!(AIB&&aiOk&&sampleFn&&now-lastAI>45000&&aiCalls<6)){play(CANNED[LANG][Math.floor(Math.random()*CANNED[LANG].length)]);return}
  banterBusy=true;lastAI=now;aiCalls++;const a=npcs[Math.floor(Math.random()*npcs.length)];let b;do{b=npcs[Math.floor(Math.random()*npcs.length)]}while(b===a);
  try{const r=await sampleFn('You write short chatter between college students and their instructor in a Filipino university computer lab game. '+langRule()+' '+npcs.map(n=>n.ai.persona.replace('You are ','')).join(' ')+' Recent chatter: '+heard.slice(-3).join(' | ')+'\nWrite 3 short lines (max 12 words each) of natural banter, starting with '+nm(a)+' talking to '+nm(b)+', alternating speakers. School-appropriate, no markdown. Format exactly "Name: line", one per line.',{modelTier:'quick',cache:false});
   const L=r.text.split('\n').map(x=>x.match(/^\s*([A-Za-z. ]+?):\s*(.+)$/)).filter(m=>m&&npcs.some(n=>nm(n)===m[1].trim())).slice(0,3).map(m=>[m[1].trim(),m[2].trim().slice(0,90)]);
   if(L.length)play(L)}catch(e){}
  banterBusy=false}
function shout(t){t=t.replace(/[\u0000-\u001f]/g,'').trim().slice(0,60);if(!t)return;myB=t;myBn++;myBUntil=performance.now()+5000;sendPresence(true)}
$('sayb').onclick=()=>{shout($('say').value);$('say').value=''};
$('say').addEventListener('keydown',e=>{if(e.key==='Enter'){shout($('say').value);$('say').value=''}});
document.querySelectorAll('.em').forEach(b=>b.onclick=()=>shout(b.textContent));
